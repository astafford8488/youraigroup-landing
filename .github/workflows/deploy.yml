name: Deploy to Cloudflare Pages

# Auto-deploy youraigroup.com on every push to master. Replaces the manual
# `wrangler pages deploy` step — Cloudflare credentials live in repo secrets
# (Settings → Secrets → Actions): CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
# Deploys to the existing `youraigroup-landing` Pages project on branch
# `master` (its production branch), so the apex + www domains update directly.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=youraigroup-landing --branch=master --commit-dirty=true
